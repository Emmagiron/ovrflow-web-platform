<!DOCTYPE html>
<html lang="es">

<head>

    <!-- ======================================
    META
    ======================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="OVRFLOW - Streetwear oversize premium de 0 a 40 años."
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <!-- ======================================
    TITLE
    ======================================= -->

    <title>
        {% block title %}
            OVRFLOW
        {% endblock %}
    </title>

    <!-- ======================================
    FAVICON
    ======================================= -->

    <link
        rel="icon"
        href="{{ url_for('static', filename='img/favicon.png') }}"
    >

    <!-- ======================================
    GOOGLE FONTS
    ======================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap"
          rel="stylesheet">

    <!-- ======================================
    SWIPER CSS
    ======================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    >

    <!-- ======================================
    MAIN CSS
    ======================================= -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <!-- ======================================
    EXTRA PAGE CSS
    ======================================= -->

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- ======================================
    PARTICLES / BACKGROUND FX
    ======================================= -->

    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>

    <!-- ======================================
    NAVBAR
    ======================================= -->

    {% include 'partials/navbar.html' %}

    <!-- ======================================
    FLASH MESSAGES
    ======================================= -->

    {% include 'partials/alerts.html' %}

    <!-- ======================================
    MAIN CONTENT
    ======================================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- ======================================
    FOOTER
    ======================================= -->

    {% include 'partials/footer.html' %}

    <!-- ======================================
    SWIPER JS
    ======================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js">
    </script>

    <!-- ======================================
    GLOBAL JS
    ======================================= -->

    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/swiper-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/whatsapp.js') }}"></script>

    <!-- ======================================
    EXTRA PAGE JS
    ======================================= -->

    {% block extra_js %}
    {% endblock %}

</body>

</html>
