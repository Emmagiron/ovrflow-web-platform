<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Login | OVR FLOW</title>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #0f172a;">
    
    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--accent);">Acceso Admin</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div>
                <label style="font-size: 0.8rem; color: var(--text-dim);">Usuario</label>
                <input type="text" name="username" placeholder="Tu usuario" required>
            </div>
            
            <div>
                <label style="font-size: 0.8rem; color: var(--text-dim);">Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" style="margin-top: 1rem;">Entrar al Sistema</button>
        </form>
        
        <a href="/" style="display: block; text-align: center; margin-top: 1.5rem; color: var(--text-dim); text-decoration: none; font-size: 0.9rem;">← Volver a la tienda</a>
    </div>

</body>
</html>
